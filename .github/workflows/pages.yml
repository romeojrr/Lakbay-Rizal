# Optional: publish to GitHub Pages. Run it by hand from the Actions tab
# (Settings → Pages → Source: GitHub Actions). Set "include_drafts" to true for a
# classroom/test site; leave it false for the real site (only verified stops, FR-62).
name: Deploy to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      include_drafts:
        description: 'Show draft stops (classroom / testing site)'
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # The site lives at https://<user>.github.io/<repository>/
          BASE_PATH: /${{ github.event.repository.name }}/
          INCLUDE_DRAFTS: ${{ inputs.include_drafts }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
