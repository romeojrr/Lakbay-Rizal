<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lakbay Rizal – Berlin Quiz</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&amp;family=Nunito:wght@600;700;800&amp;display=swap">
<style>
body{margin:0;background:#F4EEDF}
a{color:#1F1A24}a:hover{color:#000}
.pf{font-family:'Pixelify Sans',monospace}
.pix{image-rendering:pixelated}
</style>
</helmet>
<div style="min-height:100vh;background:#F4EEDF;font-family:Nunito,sans-serif;color:#1F1A24">

<header style="background:#1F1A24;color:#F6F0E1;border-bottom:4px solid #6B4A2B">
<div style="max-width:1400px;margin:0 auto;padding:12px 24px;display:flex;flex-wrap:wrap;align-items:center;gap:16px 24px">
<a href="Main.dc.html" style="display:flex;align-items:center;gap:10px;text-decoration:none;color:#F6F0E1">
<img class="pix" src="../../assets/sprites/rizal_adult_suit.png" alt="" style="width:24px;height:55px">
<span class="pf" style="font-size:26px;font-weight:700;letter-spacing:1px">LAKBAY RIZAL</span>
</a>
<a href="Story.dc.html" class="pf" style="font-size:16px;text-decoration:none;color:#F6F0E1;border:2px solid #5A5266;padding:8px 14px">◀ Back to story</a>
<span style="flex:1"></span>
<a href="Passport.dc.html" class="pf" style="font-size:16px;text-decoration:none;color:#1F1A24;background:#D9A441;border:2px solid #F6F0E1;padding:8px 14px">Passport · 7/25</a>
</div>
</header>

<main style="max-width:1000px;margin:0 auto;padding:28px 24px 40px;display:flex;flex-direction:column;gap:22px;box-sizing:border-box">

<div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap">
<span class="pf" style="font-size:22px;font-weight:700">Berlin Quiz</span>
<div style="flex:1 1 200px;height:16px;background:#FFFFFF;border:3px solid #1F1A24"><div style="width:50%;height:100%;background:#8B5CD6"></div></div>
<span class="pf" style="font-size:16px;color:#4E4658">Question 1 of 2</span>
</div>

<div style="position:relative;border:3px solid #1F1A24;box-shadow:6px 6px 0 #1F1A24;overflow:hidden;min-height:280px;display:flex;align-items:center;justify-content:center;padding:32px 20px;box-sizing:border-box">
<img class="pix" src="../../assets/scenes/berlin_1887.png" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover">
<div style="position:absolute;inset:0;background:rgba(31,26,36,0.55)"></div>
<div style="position:relative;max-width:640px;background:#FFFDF6;border:4px solid #1F1A24;box-shadow:inset 0 0 0 3px #D9A441,6px 6px 0 #1F1A24;padding:26px 28px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center">
<img class="pix" src="../../assets/icons/stamp_berlin.png" alt="" style="width:52px;height:52px">
<p style="margin:0;font-size:28px;line-height:1.3;font-weight:800">Who lent Rizal the money to print Noli Me Tangere?</p>
</div>
</div>

<div role="group" aria-label="Answers" style="display:flex;flex-wrap:wrap;gap:14px">
<sc-for list="{{ options }}" as="o" hint-placeholder-count="4">
<button onClick="{{ o.pick }}" style="flex:1 1 380px;min-height:68px;display:flex;align-items:center;gap:14px;padding:10px 16px;text-align:left;font-family:Nunito,sans-serif;font-size:20px;font-weight:800;color:{{ o.fg }};background:{{ o.bg }};border:3px solid #1F1A24;box-shadow:4px 4px 0 #1F1A24;cursor:pointer">
<span class="pf" style="width:38px;height:38px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;color:#1F1A24;background:#F6F0E1;border:3px solid #1F1A24">{{ o.mark }}</span>
<span>{{ o.label }}</span>
</button>
</sc-for>
</div>

<sc-if value="{{ none }}" hint-placeholder-val="{{ true }}">
<p class="pf" style="margin:0;text-align:center;font-size:18px;color:#4E4658">Pick an answer</p>
</sc-if>
<sc-if value="{{ right }}" hint-placeholder-val="{{ false }}">
<div style="display:flex;flex-wrap:wrap;align-items:center;gap:16px;background:#FFFFFF;border:3px solid #1F1A24;box-shadow:6px 6px 0 #1F1A24;padding:16px 18px">
<div style="width:64px;height:64px;flex-shrink:0;background:#F6F0E1;border:3px dashed #8B5CD6;display:flex;align-items:center;justify-content:center;transform:rotate(-4deg)">
<img class="pix" src="../../assets/icons/stamp_berlin.png" alt="" style="width:48px;height:48px">
</div>
<div style="flex:1 1 220px;display:flex;flex-direction:column;gap:4px">
<span class="pf" style="font-size:24px;font-weight:700;color:#23703A">Correct!</span>
<span style="font-size:17px;font-weight:700">Berlin stamp and the Noli Me Tangere item are yours.</span>
</div>
<a href="Passport.dc.html" class="pf" style="font-size:18px;font-weight:700;text-decoration:none;color:#1F1A24;background:#E8892B;border:3px solid #1F1A24;box-shadow:4px 4px 0 #1F1A24;padding:12px 18px">Open passport ▶</a>
</div>
</sc-if>
<sc-if value="{{ wrong }}" hint-placeholder-val="{{ false }}">
<div style="display:flex;flex-direction:column;gap:6px;background:#FFFFFF;border:3px solid #1F1A24;box-shadow:6px 6px 0 #1F1A24;padding:16px 18px">
<span class="pf" style="font-size:22px;font-weight:700">Try again</span>
<span style="font-size:17px;font-weight:700">Hint: he was a doctor friend from Bulacan who visited Rizal in Berlin.</span>
</div>
</sc-if>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":760}}'>
class Component extends DCLogic {
constructor(p) { super(p); this.state = { picked: null }; }
renderVals() {
const opts = [
{ id: 'a', letter: 'A', label: 'Ferdinand Blumentritt' },
{ id: 'b', letter: 'B', label: 'Maximo Viola' },
{ id: 'c', letter: 'C', label: 'Marcelo H. del Pilar' },
{ id: 'd', letter: 'D', label: 'Graciano López Jaena' }
];
const right = 'b', p = this.state.picked;
return {
options: opts.map((o) => {
let bg = '#FFFFFF', fg = '#1F1A24', mark = o.letter;
if (p && o.id === right) { bg = '#23703A'; fg = '#FFFFFF'; mark = '✓'; }
else if (p === o.id) { bg = '#F6C3BD'; mark = '✗'; }
return { ...o, bg, fg, mark, pick: () => this.setState({ picked: o.id }) };
}),
none: !p, right: p === right, wrong: !!p && p !== right
};
}
}
</script>
</body>
</html>
