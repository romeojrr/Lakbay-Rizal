<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lakbay Rizal – Scene Gallery</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&amp;family=Nunito:wght@600;700;800&amp;display=swap">
<style>
body{margin:0;background:#F4EEDF}
a{color:#1F1A24}a:hover{color:#000}
.pf{font-family:'Pixelify Sans',monospace}
.pix{image-rendering:pixelated}
</style>
</helmet>
<div style="min-height:100vh;background:#F4EEDF;font-family:Nunito,sans-serif;color:#1F1A24">

<header style="background:#1F1A24;color:#F6F0E1;border-bottom:4px solid #6B4A2B">
<div style="max-width:1400px;margin:0 auto;padding:12px 24px;display:flex;flex-wrap:wrap;align-items:center;gap:16px 24px">
<a href="Main.dc.html" style="display:flex;align-items:center;gap:10px;text-decoration:none;color:#F6F0E1">
<img class="pix" src="../../assets/sprites/rizal_adult_suit.png" alt="" style="width:24px;height:55px">
<span class="pf" style="font-size:26px;font-weight:700;letter-spacing:1px">LAKBAY RIZAL</span>
</a>
<a href="Main.dc.html" class="pf" style="font-size:16px;text-decoration:none;color:#F6F0E1;border:2px solid #5A5266;padding:8px 14px">◀ Back to map</a>
<span style="flex:1"></span>
<span class="pf" style="font-size:16px;color:#F6F0E1">Scene gallery · 25 of 25</span>
</div>
</header>

<main style="max-width:1400px;margin:0 auto;padding:24px;display:flex;flex-wrap:wrap;gap:24px;box-sizing:border-box;align-items:flex-start">

<section aria-label="Scene" style="flex:999 1 600px;min-width:0;display:flex;flex-direction:column;gap:18px">
<div style="background:#6B4A2B;padding:8px;box-shadow:inset 0 0 0 2px #8A6440,6px 6px 0 #1F1A24;border:3px solid #1F1A24">
<div style="position:relative;border:3px solid #1F1A24;overflow:hidden">
<img class="pix" src="{{ cur.img }}" alt="{{ cur.alt }}" style="display:block;width:100%;aspect-ratio:16 / 9">
<div class="pf" style="position:absolute;left:14px;top:14px;display:flex;gap:8px;flex-wrap:wrap">
<span style="background:rgba(31,26,36,0.88);color:#F6F0E1;border:3px solid #F6F0E1;padding:6px 12px;font-size:18px;font-weight:700">{{ cur.n }} · {{ cur.place }} · {{ cur.year }}</span>
<span style="background:#F6F0E1;color:#1F1A24;border:3px solid #1F1A24;padding:6px 12px;font-size:16px;font-weight:700">{{ cur.time }}</span>
</div>
</div>
</div>
<div style="background:#FFFFFF;border:3px solid #1F1A24;box-shadow:6px 6px 0 #1F1A24;padding:18px 20px;display:flex;flex-direction:column;gap:10px">
<h2 class="pf" style="margin:0;font-size:28px;font-weight:700">{{ cur.title }}</h2>
<p style="margin:0;font-size:16px;font-weight:600;line-height:1.5">{{ cur.alt }}</p>
<p style="margin:0;font-size:14px;font-weight:700;color:#7A4A1A">To verify: {{ cur.verify }}</p>
</div>
</section>

<aside aria-label="Choose a stop" style="flex:1 1 300px;display:flex;flex-direction:column;gap:10px;min-width:0;max-height:780px;overflow-y:auto;padding:2px 10px 10px 2px">
<sc-for list="{{ items }}" as="s" hint-placeholder-count="8">
<button onClick="{{ s.pick }}" style="display:flex;align-items:center;gap:12px;padding:6px;text-align:left;background:{{ s.bg }};color:#1F1A24;border:3px solid #1F1A24;box-shadow:{{ s.shadow }};cursor:pointer;font-family:Nunito,sans-serif;flex-shrink:0">
<img class="pix" src="{{ s.img }}" alt="" style="width:112px;aspect-ratio:16 / 9;border:2px solid #1F1A24;flex-shrink:0">
<span style="display:flex;flex-direction:column;gap:2px;min-width:0">
<span class="pf" style="font-size:17px;font-weight:700">{{ s.n }} · {{ s.place }}</span>
<span class="pf" style="font-size:14px;color:#4E4658">{{ s.year }} · {{ s.time }}</span>
</span>
</button>
</sc-for>
</aside>
</main>
</div>
</x-dc>
