<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lakbay Rizal – Berlin Story</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&amp;family=Nunito:wght@600;700;800&amp;display=swap">
<style>
body{margin:0;background:#F4EEDF}
a{color:#1F1A24}a:hover{color:#000}
.pf{font-family:'Pixelify Sans',monospace}
.pix{image-rendering:pixelated}
</style>
</helmet>
<div style="min-height:100vh;background:#F4EEDF;font-family:Nunito,sans-serif;color:#1F1A24">

<header style="background:#1F1A24;color:#F6F0E1;border-bottom:4px solid #6B4A2B">
<div style="max-width:1400px;margin:0 auto;padding:12px 24px;display:flex;flex-wrap:wrap;align-items:center;gap:16px 24px">
<a href="Main.dc.html" style="display:flex;align-items:center;gap:10px;text-decoration:none;color:#F6F0E1">
<img class="pix" src="../../assets/sprites/rizal_adult_suit.png" alt="" style="width:24px;height:55px">
<span class="pf" style="font-size:26px;font-weight:700;letter-spacing:1px">LAKBAY RIZAL</span>
</a>
<a href="Main.dc.html" class="pf" style="font-size:16px;text-decoration:none;color:#F6F0E1;border:2px solid #5A5266;padding:8px 14px">◀ Back to map</a>
<span style="flex:1"></span>
<a href="Passport.dc.html" class="pf" style="font-size:16px;text-decoration:none;color:#1F1A24;background:#D9A441;border:2px solid #F6F0E1;padding:8px 14px">Passport · 7/25</a>
</div>
</header>

<main style="max-width:1400px;margin:0 auto;padding:24px;display:flex;flex-wrap:wrap;gap:24px;box-sizing:border-box">

<section aria-label="Story" style="flex:999 1 560px;min-width:0;display:flex;flex-direction:column">
<div style="background:#6B4A2B;padding:8px;box-shadow:inset 0 0 0 2px #8A6440,6px 6px 0 #1F1A24;border:3px solid #1F1A24">
<div style="position:relative;border:3px solid #1F1A24;overflow:hidden">
<img class="pix" src="../../assets/scenes/berlin_1887.png" alt="Rizal and Maximo Viola in the Berlin print works" style="display:block;width:100%;aspect-ratio:16 / 9">
<div class="pf" style="position:absolute;left:14px;top:14px;background:rgba(31,26,36,0.88);color:#F6F0E1;border:3px solid #F6F0E1;padding:6px 12px;font-size:18px;font-weight:700">Berlin · 1887</div>
<sc-if value="{{ rizalTalks }}" hint-placeholder-val="{{ false }}">
<span class="pf" style="position:absolute;left:24.5%;top:56%;font-size:20px;font-weight:700;background:#FFFFFF;border:3px solid #1F1A24;padding:0 8px">…</span>
</sc-if>
<sc-if value="{{ violaTalks }}" hint-placeholder-val="{{ true }}">
<span class="pf" style="position:absolute;left:35.5%;top:56%;font-size:20px;font-weight:700;background:#FFFFFF;border:3px solid #1F1A24;padding:0 8px">…</span>
</sc-if>
</div>
</div>

<div style="position:relative;margin:-36px 20px 0;background:#FFFDF6;border:4px solid #1F1A24;box-shadow:inset 0 0 0 3px #D9A441,6px 6px 0 #1F1A24;padding:20px;display:flex;gap:18px;align-items:flex-start">
<div style="position:relative;width:72px;height:72px;flex-shrink:0;overflow:hidden;background:#EFE7D3;border:3px solid #1F1A24">
<sc-if value="{{ hasPortrait }}" hint-placeholder-val="{{ true }}">
<img class="pix" src="{{ portrait }}" alt="" style="position:absolute;left:-12px;top:-18px;width:102px;height:234px">
</sc-if>
<sc-if value="{{ noPortrait }}" hint-placeholder-val="{{ false }}">
<img class="pix" src="../../assets/icons/stamp_berlin.png" alt="" style="position:absolute;left:10px;top:10px;width:52px;height:52px">
</sc-if>
</div>
<div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:8px">
<span class="pf" style="font-size:18px;font-weight:700;color:#B8601A">{{ speaker }}</span>
<p style="margin:0;font-size:20px;line-height:1.45;font-weight:700;min-height:58px">{{ text }}</p>
<div style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:4px">
<div style="display:flex;gap:6px">
<sc-for list="{{ dots }}" as="d" hint-placeholder-count="3">
<span style="width:12px;height:12px;background:{{ d.bg }};border:2px solid #1F1A24"></span>
</sc-for>
</div>
<button onClick="{{ next }}" class="pf" style="font-size:18px;font-weight:700;background:#1F1A24;color:#F6F0E1;border:3px solid #1F1A24;padding:8px 18px;cursor:pointer">{{ nextLabel }}</button>
</div>
</div>
</div>
</section>

<aside style="flex:1 1 320px;display:flex;flex-direction:column;gap:20px;min-width:0">
<div style="background:#FFFFFF;border:3px solid #1F1A24;box-shadow:6px 6px 0 #1F1A24;padding:18px;display:flex;flex-direction:column;gap:12px">
<div style="display:flex;justify-content:space-between;align-items:center">
<span class="pf" style="font-size:18px;font-weight:700">This stop</span>
<span class="pf" style="font-size:13px;color:#FFFFFF;background:#8B5CD6;border:2px solid #1F1A24;padding:2px 8px">Writing</span>
</div>
<div style="display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:10px">
<div style="background:#F6F0E1;border:2px solid #1F1A24;padding:10px;display:flex;flex-direction:column;gap:4px"><span class="pf" style="font-size:13px;color:#4E4658">Then</span><span style="font-size:15px;font-weight:800">Berlin, Prussia</span></div>
<div style="background:#F6F0E1;border:2px solid #1F1A24;padding:10px;display:flex;flex-direction:column;gap:4px"><span class="pf" style="font-size:13px;color:#4E4658">Today</span><span style="font-size:15px;font-weight:800">Berlin, Germany</span></div>
</div>
</div>

<div style="background:#FFFFFF;border:3px solid #1F1A24;box-shadow:6px 6px 0 #1F1A24;padding:18px;display:flex;align-items:center;gap:14px">
<div style="width:64px;height:64px;flex-shrink:0;background:#F6F0E1;border:3px solid #1F1A24;display:flex;align-items:center;justify-content:center">
<img class="pix" src="../../assets/icons/stamp_berlin.png" alt="" style="width:52px;height:52px">
</div>
<div style="display:flex;flex-direction:column;gap:4px">
<span class="pf" style="font-size:14px;color:#4E4658">Item reward</span>
<span class="pf" style="font-size:20px;font-weight:700">Noli Me Tangere</span>
</div>
</div>

<div style="background:#FFFFFF;border:3px solid #1F1A24;box-shadow:6px 6px 0 #1F1A24;padding:18px;display:flex;flex-direction:column;gap:8px">
<span class="pf" style="font-size:14px;color:#4E4658">Source</span>
<span style="font-size:15px;font-weight:700">[Add book title, author, page]</span>
</div>

<div style="display:flex;gap:10px">
<button class="pf" style="flex:1;height:52px;font-size:18px;font-weight:700;background:#FFFFFF;color:#1F1A24;border:3px solid #1F1A24;box-shadow:4px 4px 0 #1F1A24;cursor:pointer">Read more</button>
<sc-if value="{{ done }}" hint-placeholder-val="{{ false }}">
<a href="Quiz.dc.html" class="pf" style="flex:1;height:52px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;text-decoration:none;color:#1F1A24;background:#E8892B;border:3px solid #1F1A24;box-shadow:4px 4px 0 #1F1A24">Quiz ▶</a>
</sc-if>
<sc-if value="{{ notDone }}" hint-placeholder-val="{{ true }}">
<span class="pf" style="flex:1;height:52px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:#6A6272;background:#E4DCC8;border:3px solid #A39A8C">Quiz ▶</span>
</sc-if>
</div>
</aside>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":840}}'>
class Component extends DCLogic {
constructor(p) { super(p); this.state = { i: 0 }; }
renderVals() {
const RZ = '../../assets/sprites/rizal_adult_suit.png', VI = '../../assets/sprites/maximo_viola.png';
const lines = [
{ who: 'viola', pic: VI, speaker: 'Maximo Viola', text: 'José! I heard you have no money left to print your novel. Let me lend it to you.' },
{ who: 'rizal', pic: RZ, speaker: 'José Rizal', text: 'Thank you, my friend. This book will show the world how Filipinos suffer under Spanish rule.' },
{ who: 'none', pic: '', speaker: 'Narrator', text: 'March 1887: 2,000 copies of Noli Me Tangere are printed here in Berlin.' }
];
const i = this.state.i, l = lines[i], last = i === lines.length - 1;
return {
speaker: l.speaker, text: l.text, portrait: l.pic, hasPortrait: !!l.pic, noPortrait: !l.pic,
rizalTalks: l.who === 'rizal', violaTalks: l.who === 'viola',
dots: lines.map((_, k) => ({ bg: k <= i ? '#E8892B' : '#FFFFFF' })),
nextLabel: last ? 'Replay ↺' : 'Next ▶', done: last, notDone: !last,
next: () => this.setState({ i: last ? 0 : i + 1 })
};
}
}
</script>
</body>
</html>
